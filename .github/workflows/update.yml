name: Update All Servers Cadastre

on:
  schedule:
    - cron: '*/15 * * * *' # Запуск каждые 15 минут
  workflow_dispatch:      # Разрешает запуск вручную кнопкой

jobs:
  update-map:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Дает боту права на запись в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run parser script
        run: python parse.py

      - name: Configure Git User
        run: |
          git config --global user.name 'MapBot'
          git config --global user.email 'mapbot@users.noreply.github.com'

      - name: Pull latest changes (fix conflict)
        run: |
          git pull origin main --rebase || echo "No rebase needed"

      - name: Commit and Push changes
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update all servers cadastre data"
          git push
