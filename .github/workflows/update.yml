name: Update All Servers Cadastre

on:
  schedule:
    - cron: '*/15 * * * *' # Запуск каждые 15 минут
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run multi-server parser
        run: python parse.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'MapBot'
          git config --global user.email 'bot@example.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update all servers cadastre data" && git push)
